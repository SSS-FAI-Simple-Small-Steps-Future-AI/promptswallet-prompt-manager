[package]
name = "pv-core"
version = "0.1.0"
edition = "2021"
description = "PromptVault core: prompt files, templates, read-only guard, workspace store"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
regex = "1"
ulid = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
tempfile = "3"
