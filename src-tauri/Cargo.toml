[package]
name = "promptvault"
version = "0.1.0"
description = "Save, organise and reuse prompt templates"
edition = "2021"

[lib]
name = "promptvault_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pv-core = { path = "../crates/pv-core" }
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
